name: Fiona
description: "Bug WhatsApp Crasher"
publish_to: 'none'
version: 10.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  carousel_slider: 4.0.0
  web_socket_channel: ^2.4.0
  network_info_plus: ^4.1.0
  permission_handler: ^11.0.0
  socket_io_client: ^2.0.3
  font_awesome_flutter: ^10.7.0
  path_provider: ^2.1.1
  share_plus: ^7.0.1
  chewie: ^1.5.2
  image_picker: ^1.0.7
  video_player: ^2.9.2
  gallery_saver_plus: ^3.2.9
  dio: ^5.9.0
  open_filex: ^4.7.0
  smooth_page_indicator: ^1.2.1
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0
  firebase_database: ^11.3.10
  battery_plus: ^6.0.1
  system_info2: ^4.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1 # versi terbaru saat ini
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/icon.jpg
  image_path_ios: assets/icon/icon/icon.jpg
  image_path: assets/icon/icon.jpg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/logo.png
    - assets/images/reze.png
    - assets/images/landing.jpg
    - assets/videos/landing.mp4
    - assets/videos/splash.mp4
    - assets/videos/banner.mp4
    - assets/images/banner.jpg

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf

    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf

    - family: Qaxer
      fonts:
        - asset: lib/assets/Qaxer.ttf

    - family: Aktura
      fonts:
        - asset: lib/assets/Aktura-Regular.ttf

    - family: Ready
      fonts:
        - asset: lib/assets/ready.ttf